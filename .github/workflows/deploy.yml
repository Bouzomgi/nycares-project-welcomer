name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            infra/go.sum

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Lambdas
        run: |
          export CGO_ENABLED=0 GOOS=linux GOARCH=arm64
          for dir in login fetchprojects routeproject computepreprojectmessage generatethankyoumessage requestapprovaltosend sendandpinmessage recordmessage notifycompletion dlqnotifier approvalcallback sesforwarder; do
            mkdir -p lambda-build/$dir
            go build -o lambda-build/$dir/bootstrap ./lambda/$dir
          done
          mkdir -p lambda-build/mockserver
          go build -o lambda-build/mockserver/bootstrap ./internal/mockserver

      - name: Upsert SSM parameters
        env:
          NYCARES_ACCOUNT_USERNAME: ${{ secrets.NYCARES_ACCOUNT_USERNAME }}
          NYCARES_ACCOUNT_PASSWORD: ${{ secrets.NYCARES_ACCOUNT_PASSWORD }}
          NYCARES_AWS_SF_APPROVALSECRET: ${{ secrets.NYCARES_AWS_SF_APPROVALSECRET }}
        run: |
          aws ssm put-parameter --name "/nycares-project-welcomer/NYCARES_ACCOUNT_USERNAME" --value "$NYCARES_ACCOUNT_USERNAME" --type SecureString --overwrite
          aws ssm put-parameter --name "/nycares-project-welcomer/NYCARES_ACCOUNT_PASSWORD" --value "$NYCARES_ACCOUNT_PASSWORD" --type SecureString --overwrite
          aws ssm put-parameter --name "/nycares-project-welcomer/NYCARES_AWS_SF_APPROVALSECRET" --value "$NYCARES_AWS_SF_APPROVALSECRET" --type SecureString --overwrite

      - name: CDK Deploy
        working-directory: infra
        env:
          DEPLOY_MOCKSERVER: ${{ vars.DEPLOY_MOCKSERVER }}
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          NYCARES_MOCK_SENDMESSAGE: ${{ vars.DEPLOY_MOCKSERVER }}
          NYCARES_API_BASE_URL: ${{ vars.NYCARES_API_BASE_URL }}
          NYCARES_AWS_SES_SENDER: ${{ vars.NYCARES_AWS_SES_SENDER }}
          NYCARES_AWS_SES_RECIPIENT: ${{ vars.NYCARES_AWS_SES_RECIPIENT }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          go mod download
          cdk deploy --require-approval never --all
